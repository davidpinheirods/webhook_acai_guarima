<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Açaí Guarima</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <aside class="w-64 bg-purple-800 text-white flex flex-col shadow-2xl hidden md:flex">
        <div class="h-20 flex items-center justify-center border-b border-purple-700">
            <h1 class="text-2xl font-black tracking-widest text-white">GUARIMÃ</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 bg-purple-900 rounded-xl text-purple-100 font-bold transition-colors">
                <span>📊</span> Dashboard
            </a>
            <a href="parceiros.html" class="flex items-center gap-3 px-4 py-3 hover:bg-purple-700 rounded-xl text-purple-200 transition-colors opacity-70">
                <span>👥</span> Parceiros
            </a>
            <a href="fechamento.html" class="flex items-center gap-3 px-4 py-3 hover:bg-purple-700 rounded-xl text-purple-200 transition-colors opacity-70">
                <span>📦</span> Expedientes
            </a>
        </nav>
        <div class="p-4 border-t border-purple-700">
            <p class="text-xs text-purple-300 text-center">Painel Administrativo v1.0</p>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        
        <header class="h-20 bg-white shadow-sm flex items-center justify-between px-8">
            <h2 class="text-2xl font-bold text-gray-800">Visão Geral de Hoje</h2>
            <div class="flex items-center gap-4">
                <span class="text-sm text-gray-500 font-medium" id="dataAtual">--/--/----</span>
                <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center text-purple-800 font-bold">
                    Pai
                </div>
            </div>
        </header>

        <div class="p-8">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                
                <div class="bg-white rounded-2xl shadow-sm p-6 border-l-4 border-purple-500">
                    <p class="text-sm text-gray-500 font-bold uppercase tracking-wider mb-1">Açaí na Rua Hoje</p>
                    <div class="flex items-end gap-2">
                        <h3 id="dashAcessoRua" class="text-4xl font-black text-gray-800">--</h3>
                        <span class="text-lg text-gray-400 font-bold mb-1">Litros</span>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm p-6 border-l-4 border-green-500">
                    <p class="text-sm text-gray-500 font-bold uppercase tracking-wider mb-1">Pix Recebidos</p>
                    <div class="flex items-end gap-2">
                        <h3 id="dashPix" class="text-4xl font-black text-green-600">R$ --</h3>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm p-6 border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500 font-bold uppercase tracking-wider mb-1">Parceiros Rodando</p>
                    <div class="flex items-end gap-2">
                        <h3 id="dashParceiros" class="text-4xl font-black text-gray-800">--</h3>
                        <span class="text-lg text-gray-400 font-bold mb-1">Ativos</span>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Expedientes em Andamento</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-sm uppercase tracking-wider border-b">
                                <th class="py-3 px-4 font-semibold rounded-tl-lg">Vendedor</th>
                                <th class="py-3 px-4 font-semibold">Pegos</th>
                                <th class="py-3 px-4 font-semibold">Preço Litro</th>
                                <th class="py-3 px-4 font-semibold rounded-tr-lg">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaExpedientes" class="text-gray-700">
                            </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script src="js/pages/dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parceiros - Açaí Guarima</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <aside class="w-64 bg-purple-800 text-white flex flex-col shadow-2xl hidden md:flex">
        <div class="h-20 flex items-center justify-center border-b border-purple-700">
            <h1 class="text-2xl font-black tracking-widest text-white">GUARIMA</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 hover:bg-purple-700 rounded-xl text-purple-200 transition-colors opacity-70">
                <span>📊</span> Dashboard
            </a>
            <a href="parceiros.html" class="flex items-center gap-3 px-4 py-3 bg-purple-900 rounded-xl text-purple-100 font-bold transition-colors">
                <span>👥</span> Parceiros
            </a>
            <a href="fechamento.html" class="flex items-center gap-3 px-4 py-3 hover:bg-purple-700 rounded-xl text-purple-200 transition-colors opacity-70">
                <span>📦</span> Expedientes
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-8">Gestão de Parceiros</h2>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="bg-white rounded-2xl shadow-sm p-6 lg:col-span-1 h-fit">
                <h3 class="text-lg font-bold text-purple-800 mb-4">Novo Vendedor</h3>
                <form id="formVendedor" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
                        <input type="text" id="nomeVendedor" required class="w-full px-4 py-2 border rounded-lg focus:ring-purple-500 focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">PIN de Acesso (Ex: MARIA123)</label>
                        <input type="text" id="pinVendedor" required class="w-full px-4 py-2 border rounded-lg uppercase focus:ring-purple-500 focus:border-purple-500">
                    </div>
                    <div id="msgVendedor" class="hidden text-sm font-bold p-2 rounded text-center"></div>
                    <button type="submit" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-3 rounded-xl transition-colors">
                        Cadastrar Parceiro
                    </button>
                </form>
            </div>

            <div class="bg-white rounded-2xl shadow-sm p-6 lg:col-span-2">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Parceiros Cadastrados</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-500 text-sm uppercase tracking-wider border-b">
                                <th class="py-3 px-4 font-semibold">ID</th>
                                <th class="py-3 px-4 font-semibold">Nome</th>
                                <th class="py-3 px-4 font-semibold">PIN</th>
                                <th class="py-3 px-4 font-semibold">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaVendedores" class="text-gray-700">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="js/pages/parceiros.js"></script>
</body>
</html>

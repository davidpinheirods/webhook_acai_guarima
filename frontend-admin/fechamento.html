<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expedientes - Açaí Guarima</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden">

    <aside class="w-64 bg-purple-800 text-white flex flex-col shadow-2xl hidden md:flex">
        <div class="h-20 flex items-center justify-center border-b border-purple-700">
            <h1 class="text-2xl font-black tracking-widest text-white">GUARIMA</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="index.html" class="flex items-center gap-3 px-4 py-3 hover:bg-purple-700 rounded-xl text-purple-200 transition-colors opacity-70">
                <span>📊</span> Dashboard
            </a>
            <a href="parceiros.html" class="flex items-center gap-3 px-4 py-3 hover:bg-purple-700 rounded-xl text-purple-200 transition-colors opacity-70">
                <span>👥</span> Parceiros
            </a>
            <a href="fechamento.html" class="flex items-center gap-3 px-4 py-3 bg-purple-900 rounded-xl text-purple-100 font-bold transition-colors">
                <span>📦</span> Expedientes
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto p-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-8">Controle de Expedientes</h2>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <div class="bg-white rounded-2xl shadow-sm p-6 border-t-4 border-blue-500">
                <h3 class="text-lg font-bold text-gray-800 mb-4">☀️ Abrir Expediente (Manhã)</h3>
                <form id="formAbrirExpediente" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Selecione o Parceiro</label>
                        <select id="vendedorId" required class="w-full px-4 py-2 border rounded-lg bg-white focus:ring-purple-500 focus:border-purple-500">
                            <option value="" disabled selected>Carregando parceiros...</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Litros Pegos</label>
                            <input type="text" inputmode="decimal" id="litrosPegos" placeholder="Ex: 20,5" required class="w-full px-4 py-2 border rounded-lg focus:ring-purple-500 focus:border-purple-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Preço do Litro (R$)</label>
                            <input type="text" inputmode="decimal" id="precoLitro" placeholder="Ex: 18,00" required class="w-full px-4 py-2 border rounded-lg focus:ring-purple-500 focus:border-purple-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Comissão (R$)</label>
                        <input type="text" inputmode="decimal" id="comissao" placeholder="Ex: 3,00" class="w-full px-4 py-2 border rounded-lg focus:ring-purple-500 focus:border-purple-500">
                    </div>
                    
                    <div id="msgAbrir" class="hidden text-sm font-bold p-2 rounded text-center"></div>
                    
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-colors">
                        Iniciar Dia
                    </button>
                </form>
            </div>

            <div class="bg-white rounded-2xl shadow-sm p-6 border-t-4 border-green-500 opacity-60 hover:opacity-100 transition-opacity">
                <h3 class="text-lg font-bold text-gray-800 mb-4">🌙 Fechar Expediente (Acerto)</h3>
                <p class="text-sm text-gray-500 mb-4">O cálculo cego será feito baseando-se no que for devolvido.</p>
                <form class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ID do Expediente</label>
                        <input type="number" disabled placeholder="Em breve" class="w-full px-4 py-2 border rounded-lg bg-gray-100">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Litros Devolvidos</label>
                        <input type="number" disabled placeholder="Em breve" class="w-full px-4 py-2 border rounded-lg bg-gray-100">
                    </div>
                    <button type="button" disabled class="w-full bg-gray-400 text-white font-bold py-3 rounded-xl cursor-not-allowed">
                        Calcular Acerto
                    </button>
                </form>
            </div>

        </div>
    </main>

    <script src="js/pages/fechamento.js"></script>
</body>
</html>

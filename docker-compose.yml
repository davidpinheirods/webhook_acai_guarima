services:
  api:
    build: ./backend
    container_name: acai_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env # Puxa as variáveis de ambiente automaticamente
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: acai_mysql
    ports:
      - "3306:3306"
    env_file:
      - .env # Puxa a senha de root e o nome do banco
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Açaí Guarima - Vender</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="bg-purple-700 text-white shadow-lg sticky top-0 z-10 rounded-b-2xl pb-4">
        <div class="flex justify-between items-center p-4 pb-2">
            <div>
                <p class="text-xs text-purple-300 font-medium">Expediente Aberto</p>
                <h1 id="nomeVendedor" class="text-xl font-bold truncate w-48">Carregando...</h1>
            </div>
            <button id="btnLogout" class="bg-purple-800 hover:bg-red-500 px-4 py-2 rounded-lg text-sm font-bold shadow-sm transition-colors border border-purple-600">
                Sair
            </button>
        </div>

        <div class="px-4">
            <div class="bg-purple-900 bg-opacity-40 rounded-xl p-3 flex justify-between items-center text-center backdrop-blur-sm border border-purple-500 border-opacity-30">
                
                <div class="flex flex-col w-1/3 border-r border-purple-500 border-opacity-30">
                    <span class="text-[9px] text-purple-300 uppercase tracking-widest font-bold mb-1">Pegos</span>
                    <span id="statPegos" class="text-sm font-black text-white">-- L</span>
                </div>
                
                <div class="flex flex-col w-1/3 border-r border-purple-500 border-opacity-30">
                    <span class="text-[9px] text-purple-300 uppercase tracking-widest font-bold mb-1">Vendidos</span>
                    <span id="statVendidos" class="text-sm font-black text-green-400">-- L</span>
                </div>
                
                <div class="flex flex-col w-1/3">
                    <span class="text-[9px] text-purple-300 uppercase tracking-widest font-bold mb-1">Comissão</span>
                    <span id="statComissao" class="text-sm font-black text-yellow-400">R$ --</span>
                </div>

            </div>
        </div>
    </header>

    <main class="flex-grow p-4 pb-10">
        <h2 class="text-gray-700 font-medium text-center mb-6">Selecione a quantidade de açaí:</h2>
        
        <div id="gridLitros" class="grid grid-cols-2 gap-4">
            </div>
    </main>

    <div id="modalPix" class="hidden fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 flex flex-col items-center text-center shadow-2xl">
            
            <h3 class="text-xl font-bold text-gray-800 mb-2">Cobrança Pix</h3>
            <p id="modalQuantidade" class="text-purple-700 font-bold text-2xl mb-4">-- L</p>
            
            <div class="w-48 h-48 bg-gray-100 border-2 border-dashed border-gray-300 rounded-xl flex items-center justify-center mb-6">
                <span class="text-gray-400 text-sm">QR Code<br>Em Breve</span>
            </div>

            <div class="w-full space-y-3">
                <button id="btnFecharModal" class="w-full bg-gray-200 text-gray-700 font-bold py-3 rounded-xl">
                    Cancelar
                </button>
            </div>
        </div>
    </div>

    <script src="js/pages/app.js"></script>
</body>
</html>
